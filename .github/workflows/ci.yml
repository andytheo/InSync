name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Backend integration tests
        run: dotnet test backend/InSync.Api.Tests/InSync.Api.Tests.csproj --configuration Release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package.json
      - name: Mobile dependencies
        working-directory: apps/mobile
        run: npm install
      - name: TypeScript check
        working-directory: apps/mobile
        run: npx tsc --noEmit
      - name: Production publish
        run: dotnet publish backend/InSync.Api/InSync.Api.csproj --configuration Release --no-restore
      - name: Build SignalR load harness
        run: dotnet build tests/load/InSync.Load/InSync.Load.csproj --configuration Release
      - name: Verify no tracked secrets
        shell: bash
        run: |
          if git grep -nE "(postgres(ql)?://[^[:space:]]+:[^[:space:]]+@|ConnectionStrings__InSync=|EXPO_PUBLIC_API_URL=https?://(localhost|10\\.|192\\.168\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.))" -- . ":(exclude)docs/**"; then
            echo "Potential production secret or local production endpoint is tracked."
            exit 1
          fi
